# Test, then deploy to GitHub Pages.
#   - Every push to main and every pull request runs the tests.
#   - Only a push to main (or a manual run) deploys, and only if the tests passed: a failing test blocks the deploy.
#   - What gets published is just the app's own files (not tests, the worker or this workflow).
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the one in progress instead of cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the files that make up the app
        run: |
          mkdir _site
          cp -r index.html styles.css app.js sw.js manifest.webmanifest icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
