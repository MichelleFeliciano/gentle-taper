<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gentle Taper</title>
<!-- Colors the phone's status/address bar. app.js updates this when the theme changes. -->
<meta name="theme-color" content="#cfe5d3">
<meta name="description" content="A gentle, private caffeine taper tracker.">
<!-- Runs before the page paints so a dark-mode user never sees a flash of the light theme. Mirrors applyTheme() in app.js (theme and text size). -->
<script>try{var s=JSON.parse(localStorage.getItem('gentle-taper-v1')),p=s&&s.settings&&s.settings.theme||'auto';document.documentElement.dataset.theme=p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.dataset.text=s&&s.settings&&s.settings.textSize||'normal'}catch(e){}</script>
<!-- PWA: lets the site be installed to the home screen (name, icons, shortcuts: see manifest.webmanifest). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- iPhone/Android home-screen app settings: open full-screen with the app name. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gentle Taper">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- Fonts: Fraunces (headings) and Quicksand (text). The app still works with fallback fonts if offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Decorative vine borders on the left and right edges (filled in from app.js; purely visual, hidden from screen readers). -->
<div class="vine vine-l" aria-hidden="true"></div>
<div class="vine vine-r" aria-hidden="true"></div>

<!-- Header: vine strip, app title, and the subtitle app.js fills in ("Day 3 of 28", etc.). -->
<header class="top">
  <div class="top-vine" aria-hidden="true"></div>
  <!-- Header buttons (handled by data-act in app.js): Undo / Redo on the left, Search / Help on the right. -->
  <div class="hbar hbar-l">
    <button class="hbtn" id="hUndo" data-act="undo" aria-label="Nothing to undo" title="Nothing to undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="hbtn" id="hRedo" data-act="redo" aria-label="Nothing to redo" title="Nothing to redo" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  </div>
  <div class="hbar hbar-r">
    <button class="hbtn" data-act="gosearch" aria-label="Search" title="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/></svg></button>
    <button class="hbtn" data-act="gohelp" aria-label="Help" title="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8"/><path d="M12 17h.01"/></svg></button>
  </div>
  <h1 id="title">Gentle Taper</h1>
  <p id="subtitle"></p>
</header>

<!-- Notices that update by themselves: new version ready, offline, storage nearly full, couldn't save (see paintBanners() in app.js). -->
<div id="banner" aria-live="polite"></div>

<!-- The active tab is drawn into this element by render() in app.js. -->
<main id="app"></main>

<!-- Bottom tab bar. app.js switches tabs from each button's data-view. -->
<nav class="tabs" id="tabs" aria-label="Main">
  <button data-view="today" aria-label="Today">
    <svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14Z"/><path d="M5 19c3-4 6-7 10-9"/></svg><span>Today</span>
  </button>
  <button data-view="plan" aria-label="Plan">
    <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="4"/><path d="M8 3v4M16 3v4M4 10h16"/></svg><span>Plan</span>
  </button>
  <button data-view="progress" aria-label="Progress">
    <svg viewBox="0 0 24 24"><path d="M4 18c3-1 4-6 7-6s3 4 6 2 3-6 3-8"/><path d="M4 21h16"/></svg><span>Progress</span>
  </button>
  <button data-view="settings" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span>Settings</span>
  </button>
</nav>

<!-- Pop-up message area (a live region, so screen readers announce it). -->
<div id="toast" role="status"><span id="toastMsg"></span><button id="toastBtn" data-act="toastact" hidden></button></div>
<!-- The app-lock screen (filled in by app.js only when a PIN or password is set; covers everything while locked). -->
<div id="lock" hidden></div>
<!-- All app logic. Placed at the end so the elements above exist when it runs. -->
<script src="app.js"></script>
</body>
</html>
